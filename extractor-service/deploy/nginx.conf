# Include inside the indek.eu server block. The exact match ensures this is not
# an arbitrary path proxy. nginx overwrites forwarding headers so TRUST_PROXY
# can safely use the client address when the service only listens on loopback.
location = /media-finder/api/extract {
    limit_req zone=media_finder_api burst=10 nodelay;

    proxy_pass http://127.0.0.1:3002/v1/extract;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 35s;
    proxy_send_timeout 5s;
    client_max_body_size 16k;
}

# This directive belongs in the top-level http block, not the server block:
# limit_req_zone $binary_remote_addr zone=media_finder_api:10m rate=10r/m;
