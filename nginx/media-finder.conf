# Include this file from your site block, e.g.:
#   include /etc/nginx/snippets/media-finder.conf;

location = /media-finder/proxy {
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    if ($arg_url = "") {
        return 400 "Missing url parameter\n";
    }

    if ($arg_url !~* "^https?://") {
        return 400 "Only http and https URLs are allowed\n";
    }

    set $target $arg_url;
    proxy_ssl_server_name on;
    proxy_pass $target;
    proxy_set_header Host $proxy_host;
    proxy_set_header User-Agent "MediaFinder/1.0";
    proxy_set_header Accept-Language "en-US,en;q=0.9";
    proxy_set_header Accept "text/html,application/xhtml+xml;q=0.9,*/*;q=0.8";
}
